[providers]
java = "maven"

[phases.setup]
nixPkgs = ["maven", "openjdk"]

[phases.build]
workingDir = "backend"
cmd = "mvn clean package -DskipTests"

[phases.start]
workingDir = "backend"
cmd = "java -jar target/school-health-management-0.0.1-SNAPSHOT.jar"

[variables]
NODE_ENV = ""
MAVEN_OPTS = "-Xmx1024m"
