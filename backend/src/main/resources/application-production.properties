# ==========================================
# PRODUCTION DATABASE (MS SQL Server) CONFIGURATION
# ==========================================
spring.datasource.url=${MSSQL_URL}
spring.datasource.username=${MSSQL_USERNAME:sa}
spring.datasource.password=${MSSQL_SA_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# JPA & HIBERNATE CONFIGURATION FOR MS SQL SERVER
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# ==========================================
# JWT Properties (use environment variables)
# ==========================================
