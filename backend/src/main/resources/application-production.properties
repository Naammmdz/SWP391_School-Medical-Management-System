school.health.jwtExpirationMs=86400000
school.health.jwtRefreshExpirationMs=604800000

# ==========================================
# MAIL CONFIGURATION (use environment variables)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:qhuyddbmt123@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ietvrrqhqomekfoo}
spring.mail.from=${MAIL_FROM:qhuyddbmt123@gmail.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
